<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>WebGPU Triangle</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header class="top-header">
        <a href="https://gitlab.tuwien.ac.at/e193-02-visvu-students/visvu-2025-piochowiak2023-vasko-liopas/"
            target="_blank" class="header-link">GitLab Repository</a>
        <a href="../docs/index.html" target="_blank" class="header-link">Documentation</a>
    </header>
    <canvas id="gpuCanvas" width="1920" height="1080"></canvas>
    <div class="perf-stats">
        <span id="perf-decode" class="perf-value perf-decode">Decode --</span>
        <span class="perf-separator">|</span>
        <span id="perf-raytrace" class="perf-value perf-raytrace">Raytrace --</span>
        <span class="perf-separator">|</span>
        <span id="perf-overall" class="perf-value perf-overall">Overall --</span>
    </div>
    <div class="controls">
        <div class="control-item">
            <span class="icon">🖱️</span>
            <span class="icon">↻</span>
            <span>Drag to rotate</span>
        </div>
        <div class="control-item">
            <span class="text-key">Shift</span>
            <span class="plus">+</span>
            <span class="icon">⇅</span>
            <span>Shift + Scroll to zoom</span>
        </div>
    </div>
    <div class="panel-row">
        <div class="controls label-panel" id="label-panel">
            <h3 class="panel-title">Label Visibility</h3>
            <div class="label-list" id="label-visibility-list" aria-label="Label visibility list"></div>
            <div class="label-panel-footer">
                <span id="label-visibility-status" class="status-pill">Waiting for dataset…</span>
                <button id="label-visibility-apply" type="button">Set</button>
            </div>
        </div>
    </div>
    <script type="module" src="app.js"></script>
</body>

</html>
